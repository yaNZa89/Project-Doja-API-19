name: PocketDoJa API 19 emulator smoke test

on:
  workflow_run:
    workflows: ["Build PocketDoJa API 19 from uploaded ZIP"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  android-19-emulator:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Download APK from build run
        uses: actions/download-artifact@v4
        with:
          name: pocketdoja-android44-legacy-manual-debug
          path: apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install emulator runtime libraries
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Set up and boot Android 4.4 emulator
        shell: bash
        timeout-minutes: 25
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK is missing on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          AVDMANAGER="$(find "$SDK/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -1)"
          [ -n "$SDKMANAGER" ] && [ -n "$AVDMANAGER" ] || { echo "::error::SDK command-line tools missing"; exit 1; }
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/build-tools/35.0.0:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          timeout 12m "$SDKMANAGER" --install "platform-tools" "emulator" "build-tools;35.0.0" "system-images;android-19;default;x86"
          echo "no" | "$AVDMANAGER" create avd -n pocketdoja-api19 -k "system-images;android-19;default;x86" -d "Nexus One" --force

          # GitHub-hosted runners expose /dev/kvm as root:kvm. Grant the runner
          # process access before deciding to fall back to QEMU TCG.
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm || true
          fi
          EMULATOR_ARGS=(-avd pocketdoja-api19 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 1536 -cores 2 -no-snapshot -wipe-data -no-metrics)
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            EMULATOR_ARGS+=(-accel on)
            echo "KVM device is accessible; hardware acceleration enabled." | tee diagnostics/acceleration.txt
          else
            export ANDROID_I_WANT_MY_TCG=yes
            echo "KVM is unavailable; explicitly enabling supported QEMU TCG fallback." | tee diagnostics/acceleration.txt
            EMULATOR_ARGS+=(-accel off)
          fi

          "$SDK/emulator/emulator" "${EMULATOR_ARGS[@]}" > diagnostics/emulator-boot.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > diagnostics/emulator.pid
          booted=0
          for attempt in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulator process exited before boot completed."
              break
            fi
            if timeout 8s adb -e get-state >/dev/null 2>&1; then
              state="$(timeout 8s adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$state" = "1" ]; then booted=1; break; fi
            fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "::error::Android 4.4 emulator did not finish booting within 15 minutes."
            adb devices -l > diagnostics/adb-devices.txt 2>&1 || true
            if timeout 8s adb -e get-state >/dev/null 2>&1; then
              timeout 15s adb -e logcat -d -v threadtime > diagnostics/logcat-boot-failure.txt 2>&1 || true
            fi
            tail -300 diagnostics/emulator-boot.log || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi
          timeout 15s adb shell settings put global window_animation_scale 0 || true
          timeout 15s adb shell settings put global transition_animation_scale 0 || true
          timeout 15s adb shell settings put global animator_duration_scale 0 || true
          echo "Android 4.4 API 19 boot completed."
      - name: Collect runner and emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "PocketDoJa API 19 runner diagnostics"
            date -u
            echo
            echo "=== ADB devices ==="
            adb devices -l 2>&1 || true
            echo
            echo "=== KVM availability ==="
            ls -l /dev/kvm 2>&1 || true
            echo
            echo "=== Emulator processes ==="
            pgrep -af 'emulator|qemu|adb' || true
            echo
            echo "=== AVD files ==="
            find "$HOME/.android/avd" -maxdepth 3 -type f -printf '%p (%s bytes)\n' 2>&1 | head -200 || true
            echo
            echo "=== Recent emulator logs ==="
            find "$HOME/.android" -type f \( -iname '*emulator*.log' -o -iname 'emulator*.txt' \) -print 2>/dev/null | head -30
            echo
            echo "=== SDK emulator version ==="
            "$ANDROID_HOME/emulator/emulator" -version 2>&1 || true
          } > diagnostics/runner-diagnostics.txt
          cat diagnostics/runner-diagnostics.txt

      - name: Upload emulator evidence and TXT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketdoja-api19-diagnostics
          path: |
            diagnostics/
            game-assets/
          if-no-files-found: warn
          retention-days: 14
