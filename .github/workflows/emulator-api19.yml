name: PocketDoJa API 19 emulator smoke test

on:
  workflow_run:
    workflows: ["Build PocketDoJa API 19 from uploaded ZIP"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  android-19-emulator:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Download APK from build run
        uses: actions/download-artifact@v4
        with:
          name: pocketdoja-android44-legacy-manual-debug
          path: apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install emulator runtime libraries
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Set up and boot Android 4.4 emulator
        shell: bash
        timeout-minutes: 25
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK is missing on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          AVDMANAGER="$(find "$SDK/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -1)"
          [ -n "$SDKMANAGER" ] && [ -n "$AVDMANAGER" ] || { echo "::error::SDK command-line tools missing"; exit 1; }
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/build-tools/35.0.0:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          timeout 12m "$SDKMANAGER" --install "platform-tools" "emulator" "build-tools;35.0.0" "system-images;android-19;default;x86"
          echo "no" | "$AVDMANAGER" create avd -n pocketdoja-api19 -k "system-images;android-19;default;x86" -d "Nexus One" --force

          # GitHub-hosted runners expose /dev/kvm as root:kvm. Grant the runner
          # process access before deciding to fall back to QEMU TCG.
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm || true
          fi
          EMULATOR_ARGS=(-avd pocketdoja-api19 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 1536 -cores 2 -no-snapshot -wipe-data -no-metrics)
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            EMULATOR_ARGS+=(-accel on)
            echo "KVM device is accessible; hardware acceleration enabled." | tee diagnostics/acceleration.txt
          else
            export ANDROID_I_WANT_MY_TCG=yes
            echo "KVM is unavailable; explicitly enabling supported QEMU TCG fallback." | tee diagnostics/acceleration.txt
            EMULATOR_ARGS+=(-accel off)
          fi

          "$SDK/emulator/emulator" "${EMULATOR_ARGS[@]}" > diagnostics/emulator-boot.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > diagnostics/emulator.pid
          booted=0
          for attempt in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulator process exited before boot completed."
              break
            fi
            if timeout 8s adb -e get-state >/dev/null 2>&1; then
              state="$(timeout 8s adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$state" = "1" ]; then booted=1; break; fi
            fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "::error::Android 4.4 emulator did not finish booting within 15 minutes."
            adb devices -l > diagnostics/adb-devices.txt 2>&1 || true
            if timeout 8s adb -e get-state >/dev/null 2>&1; then
              timeout 15s adb -e logcat -d -v threadtime > diagnostics/logcat-boot-failure.txt 2>&1 || true
            fi
            tail -300 diagnostics/emulator-boot.log || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi
          timeout 15s adb shell settings put global window_animation_scale 0 || true
          timeout 15s adb shell settings put global transition_animation_scale 0 || true
          timeout 15s adb shell settings put global animator_duration_scale 0 || true
          echo "Android 4.4 API 19 boot completed."
      - name: Check out test descriptor and workflow assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare and stage Monster Hunter DoJa test package
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          mkdir -p game-assets diagnostics
          cp test-assets/mhi_9.jam game-assets/mhi_9.jam
          JAR_URL="http://mhi.gs.keitaiarchive.org/sh/i/mh/up/appli_904i/mhi_9.jar"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 "$JAR_URL" -o game-assets/mhi_9.jar
          echo "29239c996d454c53bc32af959537eb76c72f25ece24b8207b8034daa35d8948e  game-assets/mhi_9.jar" | sha256sum --check -
          SP_URL="http://mhi.gs.keitaiarchive.org/sh/i/mh/up/appli_904i/mhi_9.sp"
          if curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 "$SP_URL" -o game-assets/mhi_9.sp.tmp; then
            if echo "97cac37b3b4f468c1520d1c7e01a5b2f9b1324892fe4bcb6c9720878ffa3906d  game-assets/mhi_9.sp.tmp" | sha256sum --check -; then
              mv game-assets/mhi_9.sp.tmp game-assets/mhi_9.sp
              echo "Original scratchpad downloaded and checksum-verified."
            else
              rm -f game-assets/mhi_9.sp.tmp
            fi
          fi
          if [ ! -s game-assets/mhi_9.sp ]; then
            # The JAR contains the same m_pc1.mtra payload as the supplied SP.
            # Use its embedded ZIP container as a reproducible fallback.
            python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('game-assets/mhi_9.jar') as z:
              data=z.read('syokibugu')
          with open('game-assets/mhi_9.sp','wb') as f: f.write(data)
          with zipfile.ZipFile('game-assets/mhi_9.sp') as z:
              assert z.namelist()==['m_pc1.mtra']
              assert len(z.read('m_pc1.mtra'))==42019
          print('SP fallback prepared from identical m_pc1.mtra payload in JAR; original SP hash is not claimed.')
          PY
          fi
          sha256sum game-assets/* | tee diagnostics/game-assets-sha256.txt
          # Copy through run-as into app-private storage. /data/local/tmp is
          # shell-owned and unreadable by the app UID, so passing that path to
          # EntryActivity would produce a false "JAM not found" launch failure.
          adb shell run-as com.shibesan.pocketdoja mkdir -p files/testgame
          adb shell run-as com.shibesan.pocketdoja sh -c 'cat > files/testgame/mhi_9.jam' < game-assets/mhi_9.jam
          adb shell run-as com.shibesan.pocketdoja sh -c 'cat > files/testgame/mhi_9.jar' < game-assets/mhi_9.jar
          adb shell run-as com.shibesan.pocketdoja sh -c 'cat > files/testgame/mhi_9.sp' < game-assets/mhi_9.sp
          adb shell run-as com.shibesan.pocketdoja ls -l files/testgame | tee diagnostics/game-assets-on-emulator.txt
      - name: Install and launch PocketDoJa on Android 4.4
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          APK="$(find apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" | tee diagnostics/apk-info.txt
          timeout 30s adb wait-for-device
          timeout 120s adb install -r "$APK"
          BADGING="$(aapt dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          ACTIVITY="$(printf '%s\n' "$BADGING" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)"
          if [ -z "$PACKAGE" ] || [ -z "$ACTIVITY" ]; then
            echo "::error::Could not determine APK package/launch activity."
            printf '%s\n' "$BADGING" | tee diagnostics/apk-badging.txt
            exit 1
          fi
          printf 'Package: %s\nLaunch activity: %s\n' "$PACKAGE" "$ACTIVITY" | tee -a diagnostics/apk-info.txt
          timeout 30s adb shell am force-stop "$PACKAGE" || true
          timeout 45s adb shell am start -W -n "$PACKAGE/$ACTIVITY"
          sleep 15
          timeout 20s adb shell dumpsys activity activities > diagnostics/activity-after-launch.txt
          timeout 20s adb shell dumpsys window windows > diagnostics/windows-after-launch.txt
          # Android 4.4's toolbox may not provide pidof. Verify the foreground
          # Activity through ActivityManager instead.
          if ! grep -E 'mResumedActivity:.*com\.shibesan\.pocketdoja|Run #[0-9]+: ActivityRecord.*com\.shibesan\.pocketdoja' diagnostics/activity-after-launch.txt; then
            echo "::error::PocketDoJa is not present as a resumed/running activity on API 19."
            timeout 30s adb logcat -d -v threadtime > diagnostics/logcat-launch-failure.txt || true
            exit 1
          fi
          timeout 30s adb shell uiautomator dump /data/local/tmp/window.xml >/dev/null 2>&1 || true
          timeout 20s adb pull /data/local/tmp/window.xml diagnostics/emulator-window.xml || true
          # Android 4.4 images may mount /sdcard read-only; use writable app data temp.
          timeout 20s adb shell screencap -p /data/local/tmp/screen.png
          timeout 20s adb pull /data/local/tmp/screen.png diagnostics/emulator-screen.png
          timeout 45s adb logcat -d -v threadtime > diagnostics/logcat-api19.txt
          echo "API 19 APK install-and-launch smoke test passed."
      - name: Launch Monster Hunter directly through EntryActivity
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          adb logcat -c
          adb shell am force-stop com.shibesan.pocketdoja || true
          timeout 45s adb shell am start -W -n com.shibesan.pocketdoja/opendoja.android.EntryActivity --es jamPath /data/data/com.shibesan.pocketdoja/files/testgame/mhi_9.jam
          sleep 45
          adb shell dumpsys activity activities > diagnostics/activity-after-monster-hunter.txt
          adb shell dumpsys window windows > diagnostics/windows-after-monster-hunter.txt
          adb shell screencap -p /data/local/tmp/monster-hunter-screen.png
          adb pull /data/local/tmp/monster-hunter-screen.png diagnostics/monster-hunter-screen.png
          adb logcat -d -v threadtime > diagnostics/logcat-monster-hunter.txt
          if grep -E 'FATAL EXCEPTION|Fatal signal|ANR in com\.shibesan\.pocketdoja' diagnostics/logcat-monster-hunter.txt; then
            echo "::error::Monster Hunter launch produced a fatal error; see logcat-monster-hunter.txt"
            exit 1
          fi
          if ! grep -E 'mResumedActivity:.*opendoja\.android\.EntryActivity|ActivityRecord.*opendoja\.android\.EntryActivity' diagnostics/activity-after-monster-hunter.txt; then
            echo "::error::EntryActivity did not remain active after the Monster Hunter launch attempt."
            exit 1
          fi
          echo "Monster Hunter launch attempt captured; inspect screenshot and logcat to determine whether the game reached its menu."
      - name: Collect runner and emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "PocketDoJa API 19 runner diagnostics"
            date -u
            echo
            echo "=== ADB devices ==="
            adb devices -l 2>&1 || true
            echo
            echo "=== KVM availability ==="
            ls -l /dev/kvm 2>&1 || true
            echo
            echo "=== Emulator processes ==="
            pgrep -af 'emulator|qemu|adb' || true
            echo
            echo "=== AVD files ==="
            find "$HOME/.android/avd" -maxdepth 3 -type f -printf '%p (%s bytes)\n' 2>&1 | head -200 || true
            echo
            echo "=== Recent emulator logs ==="
            find "$HOME/.android" -type f \( -iname '*emulator*.log' -o -iname 'emulator*.txt' \) -print 2>/dev/null | head -30
            echo
            echo "=== SDK emulator version ==="
            "$ANDROID_HOME/emulator/emulator" -version 2>&1 || true
          } > diagnostics/runner-diagnostics.txt
          cat diagnostics/runner-diagnostics.txt

      - name: Upload emulator evidence and TXT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketdoja-api19-diagnostics
          path: |
            diagnostics/
            game-assets/
          if-no-files-found: warn
          retention-days: 14
