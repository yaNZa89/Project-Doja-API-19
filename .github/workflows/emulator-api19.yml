name: PocketDoJa API 19 emulator smoke test

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build workflow run ID containing the API 19 APK artifact
        required: true
        type: string
  workflow_run:
    workflows: ["Build PocketDoJa API 19 from uploaded ZIP"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  android-19-emulator:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out test descriptor and workflow assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download APK from build run
        uses: actions/download-artifact@v4
        with:
          name: pocketdoja-android44-legacy-manual-debug
          path: apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}

      - name: Verify downloaded APK artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "APK artifact directory:"
          if [ ! -d "$GITHUB_WORKSPACE/apk" ]; then
            echo "::error::APK artifact directory is missing after download."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -printf '%p (%s bytes)\\n' | head -200 || true
            exit 1
          fi
          find "$GITHUB_WORKSPACE/apk" -type f -printf '%p (%s bytes)\\n'
          APK_COUNT="$(find "$GITHUB_WORKSPACE/apk" -type f -name '*.apk' | wc -l)"
          if [ "$APK_COUNT" -lt 1 ]; then
            echo "::error::Artifact downloaded, but it contains no APK file."
            exit 1
          fi

      - name: Install emulator runtime libraries
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Set up and boot Android 4.4 emulator
        shell: bash
        timeout-minutes: 25
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK is missing on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          AVDMANAGER="$(find "$SDK/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -1)"
          [ -n "$SDKMANAGER" ] && [ -n "$AVDMANAGER" ] || { echo "::error::SDK command-line tools missing"; exit 1; }
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/build-tools/35.0.0:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          timeout 12m "$SDKMANAGER" --install "platform-tools" "emulator" "build-tools;35.0.0" "system-images;android-19;default;x86"
          echo "no" | "$AVDMANAGER" create avd -n pocketdoja-api19 -k "system-images;android-19;default;x86" -d "Nexus One" --force
          # Explicitly provision a writable emulated SD card for API 19.
          SD_CARD_IMAGE="$RUNNER_TEMP/pocketdoja-api19-sdcard.img"
          "$SDK/emulator/mksdcard" 512M "$SD_CARD_IMAGE"
          printf "\nhw.sdCard=yes\nsdcard.size=512M\n" >> "$HOME/.android/avd/pocketdoja-api19.avd/config.ini"

          # GitHub-hosted runners expose /dev/kvm as root:kvm. Grant the runner
          # process access before deciding to fall back to QEMU TCG.
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm || true
          fi
          EMULATOR_ARGS=(-avd pocketdoja-api19 -sdcard "$SD_CARD_IMAGE" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 1536 -cores 2 -no-snapshot -wipe-data -no-metrics)
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            EMULATOR_ARGS+=(-accel on)
            echo "KVM device is accessible; hardware acceleration enabled." | tee diagnostics/acceleration.txt
          else
            export ANDROID_I_WANT_MY_TCG=yes
            echo "KVM is unavailable; explicitly enabling supported QEMU TCG fallback." | tee diagnostics/acceleration.txt
            EMULATOR_ARGS+=(-accel off)
          fi

          "$SDK/emulator/emulator" "${EMULATOR_ARGS[@]}" > diagnostics/emulator-boot.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > diagnostics/emulator.pid
          booted=0
          for attempt in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulator process exited before boot completed."
              break
            fi
            if timeout 8s adb -e get-state >/dev/null 2>&1; then
              state="$(timeout 8s adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$state" = "1" ]; then booted=1; break; fi
            fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "::error::Android 4.4 emulator did not finish booting within 15 minutes."
            adb devices -l > diagnostics/adb-devices.txt 2>&1 || true
            if timeout 8s adb -e get-state >/dev/null 2>&1; then
              timeout 15s adb -e logcat -d -v threadtime > diagnostics/logcat-boot-failure.txt 2>&1 || true
            fi
            tail -300 diagnostics/emulator-boot.log || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi
          timeout 15s adb shell settings put global window_animation_scale 0 || true
          timeout 15s adb shell settings put global transition_animation_scale 0 || true
          timeout 15s adb shell settings put global animator_duration_scale 0 || true
          echo "Android 4.4 API 19 boot completed."
      - name: Install and launch PocketDoJa on Android 4.4
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          APK="$(find apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" | tee diagnostics/apk-info.txt
          timeout 30s adb wait-for-device
          timeout 120s adb install -r "$APK"
          BADGING="$(aapt dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          ACTIVITY="$(printf '%s\n' "$BADGING" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)"
          if [ -z "$PACKAGE" ] || [ -z "$ACTIVITY" ]; then
            echo "::error::Could not determine APK package/launch activity."
            printf '%s\n' "$BADGING" | tee diagnostics/apk-badging.txt
            exit 1
          fi
          printf 'Package: %s\nLaunch activity: %s\n' "$PACKAGE" "$ACTIVITY" | tee -a diagnostics/apk-info.txt
          timeout 30s adb shell am force-stop "$PACKAGE" || true
          timeout 45s adb shell am start -W -n "$PACKAGE/$ACTIVITY"
          sleep 15
          timeout 20s adb shell dumpsys activity activities > diagnostics/activity-after-launch.txt
          timeout 20s adb shell dumpsys window windows > diagnostics/windows-after-launch.txt
          # Android 4.4's toolbox may not provide pidof. Verify the foreground
          # Activity through ActivityManager instead.
          if ! grep -E 'mResumedActivity:.*com\.shibesan\.pocketdoja|Run #[0-9]+: ActivityRecord.*com\.shibesan\.pocketdoja' diagnostics/activity-after-launch.txt; then
            echo "::error::PocketDoJa is not present as a resumed/running activity on API 19."
            timeout 30s adb logcat -d -v threadtime > diagnostics/logcat-launch-failure.txt || true
            exit 1
          fi
          timeout 30s adb shell uiautomator dump /data/local/tmp/window.xml >/dev/null 2>&1 || true
          timeout 20s adb pull /data/local/tmp/window.xml diagnostics/emulator-window.xml || true
          # Android 4.4 images may mount /sdcard read-only; use writable app data temp.
          timeout 20s adb shell screencap -p /data/local/tmp/screen.png
          timeout 20s adb pull /data/local/tmp/screen.png diagnostics/emulator-screen.png
          timeout 45s adb logcat -d -v threadtime > diagnostics/logcat-api19.txt
          echo "API 19 APK install-and-launch smoke test passed."
      - name: Import Monster Hunter i from test-assets and verify game appears
        shell: bash
        timeout-minutes: 8
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          test -s test-assets/mhi_9.jam
          test -s test-assets/mhi_9.jar
          test -s test-assets/mhi_9.sp
          mkdir -p diagnostics/game-assets
          cp test-assets/mhi_9.* diagnostics/game-assets/
          adb shell mount > diagnostics/mounts-before-import.txt
          adb shell mkdir -p /sdcard/PocketDoJaTest
          adb push test-assets/mhi_9.jam /sdcard/PocketDoJaTest/mhi_9.jam
          adb push test-assets/mhi_9.jar /sdcard/PocketDoJaTest/mhi_9.jar
          adb push test-assets/mhi_9.sp /sdcard/PocketDoJaTest/mhi_9.sp
          adb shell am force-stop com.shibesan.pocketdoja
          adb shell monkey -p com.shibesan.pocketdoja 1 >/dev/null
          sleep 8

          # Dump the real UI and tap the visible menu button, then Import .JAM.
          adb shell input tap 454 42
          sleep 2
          adb shell uiautomator dump /data/local/tmp/menu.xml >/dev/null
          adb pull /data/local/tmp/menu.xml diagnostics/menu.xml
          python3 - <<'PY' > diagnostics/menu-tap.txt
          import re
          s=open("diagnostics/menu.xml",encoding="utf-8").read()
          nodes=re.findall(r'<node[^>]*text="([^"]*)"[^>]*bounds="([^"]+)"',s)
          for text,bounds in nodes:
              if "Import" in text and ".JAM" in text:
                  nums=list(map(int,re.findall(r'\d+',bounds)))
                  print((nums[0]+nums[2])//2,(nums[1]+nums[3])//2)
                  break
          else:
              raise SystemExit("Import .JAM menu item not visible in UI hierarchy: "+str(nodes))
          PY
          read -r MX MY < diagnostics/menu-tap.txt
          adb shell input tap "$MX" "$MY"
          sleep 3

          # The app's built-in picker starts at /sdcard. Open the staged folder.
          adb shell uiautomator dump /data/local/tmp/picker.xml >/dev/null
          adb pull /data/local/tmp/picker.xml diagnostics/picker-root.xml
          python3 - <<'PY' > diagnostics/picker-folder-tap.txt
          import re
          s=open("diagnostics/picker-root.xml",encoding="utf-8").read()
          nodes=re.findall(r'<node[^>]*text="([^"]*)"[^>]*bounds="([^"]+)"',s)
          for text,bounds in nodes:
              if text.strip() == "PocketDoJaTest/":
                  n=list(map(int,re.findall(r'\d+',bounds)))
                  print((n[0]+n[2])//2,(n[1]+n[3])//2)
                  break
          else:
              raise SystemExit("Staged test folder not visible in picker: "+str(nodes))
          PY
          read -r FX FY < diagnostics/picker-folder-tap.txt
          adb shell input tap "$FX" "$FY"
          sleep 2

          # Accept the selected folder, then confirm the app's import prompt.
          adb shell uiautomator dump /data/local/tmp/picker-folder.xml >/dev/null
          adb pull /data/local/tmp/picker-folder.xml diagnostics/picker-folder.xml
          python3 - <<'PY' > diagnostics/picker-accept-tap.txt
          import re
          s=open("diagnostics/picker-folder.xml",encoding="utf-8").read()
          nodes=re.findall(r'<node[^>]*text="([^"]*)"[^>]*bounds="([^"]+)"',s)
          for text,bounds in nodes:
              if text.startswith("Choose this folder:"):
                  n=list(map(int,re.findall(r'\d+',bounds)))
                  print((n[0]+n[2])//2,(n[1]+n[3])//2)
                  break
          else:
              raise SystemExit("Choose-this-folder action not visible: "+str(nodes))
          PY
          read -r AX AY < diagnostics/picker-accept-tap.txt
          adb shell input tap "$AX" "$AY"
          sleep 5
          adb shell uiautomator dump /data/local/tmp/import-confirm.xml >/dev/null
          adb pull /data/local/tmp/import-confirm.xml diagnostics/import-confirm.xml
          python3 - <<'PY' > diagnostics/import-confirm-tap.txt
          import re
          s=open("diagnostics/import-confirm.xml",encoding="utf-8").read()
          nodes=re.findall(r'<node[^>]*text="([^"]*)"[^>]*bounds="([^"]+)"',s)
          for text,bounds in nodes:
              if text.strip() == "Import":
                  n=list(map(int,re.findall(r'\d+',bounds)))
                  print((n[0]+n[2])//2,(n[1]+n[3])//2)
                  break
          else:
              raise SystemExit("Import confirmation button not visible: "+str(nodes))
          PY
          read -r IX IY < diagnostics/import-confirm-tap.txt
          adb shell input tap "$IX" "$IY"
          sleep 20

          # Capture the actual result screen and full app log after import.
          adb shell screencap -p /data/local/tmp/after-import.png
          adb pull /data/local/tmp/after-import.png diagnostics/after-import.png
          adb shell uiautomator dump /data/local/tmp/after-import.xml >/dev/null
          adb pull /data/local/tmp/after-import.xml diagnostics/after-import.xml
          adb logcat -d -v threadtime > diagnostics/logcat-after-import.txt
          adb shell ls -lR /sdcard/Android/data/com.shibesan.pocketdoja/files > diagnostics/app-files-after-import.txt 2>&1 || true
          if ! grep -qi "Monster Hunter" diagnostics/after-import.xml; then
            echo "::error::Import flow completed but Monster Hunter title was not found on the PocketDoJa screen."
            exit 1
          fi
          echo "Monster Hunter i is visible in PocketDoJa after importing JAM/JAR/SP."
      - name: Collect runner and emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "PocketDoJa API 19 runner diagnostics"
            date -u
            echo
            echo "=== ADB devices ==="
            adb devices -l 2>&1 || true
            echo
            echo "=== KVM availability ==="
            ls -l /dev/kvm 2>&1 || true
            echo
            echo "=== Emulator processes ==="
            pgrep -af 'emulator|qemu|adb' || true
            echo
            echo "=== AVD files ==="
            find "$HOME/.android/avd" -maxdepth 3 -type f -printf '%p (%s bytes)\n' 2>&1 | head -200 || true
            echo
            echo "=== Recent emulator logs ==="
            find "$HOME/.android" -type f \( -iname '*emulator*.log' -o -iname 'emulator*.txt' \) -print 2>/dev/null | head -30
            echo
            echo "=== SDK emulator version ==="
            "$ANDROID_HOME/emulator/emulator" -version 2>&1 || true
          } > diagnostics/runner-diagnostics.txt
          cat diagnostics/runner-diagnostics.txt

      - name: Upload emulator evidence and TXT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketdoja-api19-diagnostics
          path: |
            diagnostics/
            game-assets/
          if-no-files-found: warn
          retention-days: 14
