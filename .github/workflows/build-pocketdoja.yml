name: Build PocketDoJa API 19 from uploaded ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract PocketDoJa source ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP file in the repository root; found ${#zips[@]}."
            ls -la
            exit 1
          fi
          mkdir source
          unzip -q "${zips[0]}" -d source
          test -f source/tools/build-api19-manual.sh
          test -f source/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"

      - name: Download exact build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/.build-deps
          curl -fL --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.6/asm-9.6.jar \
            -o source/.build-deps/asm-9.6.jar
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/androidx/multidex/multidex/2.0.1/multidex-2.0.1.aar \
            -o source/.build-deps/multidex-2.0.1.aar
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/desugar_jdk_libs_nio/2.1.4/desugar_jdk_libs_nio-2.1.4.jar \
            -o source/.build-deps/desugar_jdk_libs_nio-2.1.4.jar
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/desugar_jdk_libs_configuration_nio/2.1.4/desugar_jdk_libs_configuration_nio-2.1.4.jar \
            -o source/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.jar
          unzip -p source/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.jar \
            META-INF/desugar/d8/desugar.json \
            > source/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json
          test -s source/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json

      - name: Build Android 4.4 API 19 debug APK
        run: |
          chmod +x source/tools/build-api19-manual.sh
          source/tools/build-api19-manual.sh

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketdoja-android44-legacy-manual-debug
          path: |
            source/build-manual/PocketDoJa-legacy-v1.3.0a-api19-debug.apk
            source/build-manual/java-sources.txt
            source/build-manual/main-dex-rules.pro
          if-no-files-found: warn
          retention-days: 14
          
