name: Build PocketDoJa API 19 from uploaded ZIP
# Rebuild trigger: validate the repaired emulator-test handoff.

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-pocketdoja.yml"
      - ".github/workflows/emulator-api19.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract PocketDoJa source ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ZIP in repository root; found ${#zips[@]}."
            ls -lah
            exit 1
          fi
          mkdir source
          unzip -q "${zips[0]}" -d source

          BUILD_SCRIPT="$(find source -type f -path '*/tools/build-api19-manual.sh' -print -quit)"
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "::error::tools/build-api19-manual.sh was not found in the ZIP."
            find source -maxdepth 4 -type f | head -200
            exit 1
          fi
          SOURCE_ROOT="${BUILD_SCRIPT%/tools/build-api19-manual.sh}"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          test -f "$SOURCE_ROOT/app/src/main/AndroidManifest.xml"

      - name: Fix API 19 JAM scanner filesystem crash from user Logcat
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          resolver = root / "opendoja/src/main/java/opendoja/host/JamMetadataResolver.java"
          source = resolver.read_text(encoding="utf-8")
          marker = "    public static Properties loadJamProperties(Path jamPath) throws IOException {\n"
          overload = '''    public static Properties loadJamProperties(java.io.File jamFile) throws IOException {
                  byte[] data;
                  try (java.io.FileInputStream input = new java.io.FileInputStream(jamFile);
                       java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream()) {
                      byte[] buffer = new byte[8192];
                      int count;
                      while ((count = input.read(buffer)) != -1) {
                          output.write(buffer, 0, count);
                      }
                      data = output.toByteArray();
                  }
                  CharacterCodingException lastCodingFailure = null;
                  for (String charsetName : DoJaEncoding.defaultEncodingCandidates()) {
                      try {
                          return loadJamProperties(data, Charset.forName(charsetName));
                      } catch (CharacterCodingException exception) {
                          lastCodingFailure = exception;
                      } catch (RuntimeException ignored) {
                      }
                  }
                  if (lastCodingFailure != null) throw lastCodingFailure;
                  throw new IllegalStateException("No JAM property charsets configured");
              }

          '''
          if "loadJamProperties(java.io.File jamFile)" not in source:
              if source.count(marker) != 1:
                  raise SystemExit("Could not uniquely locate JAM metadata Path overload")
              resolver.write_text(source.replace(marker, overload + marker, 1), encoding="utf-8")

          home = root / "app/src/main/java/opendoja/android/HomeActivity.java"
          source = home.read_text(encoding="utf-8")
          old = "JamMetadataResolver.loadJamProperties(java.nio.file.Paths.get(jam.getAbsolutePath()))"
          count = source.count(old)
          if count < 2:
              if "JamMetadataResolver.loadJamProperties(jam)" not in source:
                  raise SystemExit(f"Expected scanner and icon metadata calls; found {count}")
          else:
              source = source.replace(old, "JamMetadataResolver.loadJamProperties(jam)")
          nio_read = "new String(java.nio.file.Files.readAllBytes(java.nio.file.Paths.get(nameFile.getAbsolutePath()))).trim()"
          safe_read = "new String(readAllBytesCompat(nameFile), java.nio.charset.Charset.forName(\"UTF-8\")).trim()"
          if nio_read in source:
              source = source.replace(nio_read, safe_read, 1)
          if "private static byte[] readAllBytesCompat(java.io.File file)" not in source:
              helper = '''    private static byte[] readAllBytesCompat(java.io.File file) throws IOException {
                  try (java.io.FileInputStream input = new java.io.FileInputStream(file);
                       java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream()) {
                      byte[] buffer = new byte[8192];
                      int count;
                      while ((count = input.read(buffer)) != -1) output.write(buffer, 0, count);
                      return output.toByteArray();
                  }
              }

          '''
              insertion = "    private List<GameEntry> scanGames() {"
              if source.count(insertion) != 1:
                  raise SystemExit("Could not locate scanGames insertion point")
              source = source.replace(insertion, helper + insertion, 1)
          home.write_text(source, encoding="utf-8")

          check = home.read_text(encoding="utf-8")
          scan = check[check.index("private List<GameEntry> scanGames()"):check.index("private Bitmap loadGameIcon(")]
          if "Paths.get(" in scan or "Files.readAllBytes(" in scan:
              raise SystemExit("NIO filesystem call remains in scanGames")
          if "JamMetadataResolver.loadJamProperties(jam)" not in scan:
              raise SystemExit("JAM metadata scanner was not switched to java.io.File")
          print("Patched JAM scan and icon metadata reads to use java.io.File/InputStream; no NIO default provider is invoked.")
          PY

      - name: Inspect API 19 game scanner NIO calls
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$SOURCE_ROOT/app/src/main/java/opendoja/android/HomeActivity.java"
          echo "=== scanGames declaration and body ==="
          LINE="$(grep -n 'scanGames(' "$TARGET" | head -1 | cut -d: -f1)"
          if [ -z "$LINE" ]; then echo "::error::scanGames method not found"; exit 1; fi
          START=$((LINE-8)); [ "$START" -gt 0 ] || START=1
          END=$((LINE+180))
          sed -n "${START},${END}p" "$TARGET"
          echo "=== NIO calls in HomeActivity ==="
          grep -nE 'Paths\\.|Files\\.|FileSystems\\.|java\\.nio\\.file' "$TARGET" || true

      - name: Fix rewritten JAR to DEX cache mapping
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$SOURCE_ROOT/app/src/main/java/opendoja/android/EntryActivity.java"
          test -f "$TARGET"
          python3 - "$TARGET" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          wrong = "File siblingDex = JamDexHost.dexFor(jamJar);"
          right = "File siblingDex = JamDexHost.dexFor(dexJar);"
          count = source.count(wrong)
          if count == 0:
              if right in source:
                  print("DEX cache mapping is already corrected.")
                  raise SystemExit(0)
              raise SystemExit("Expected class-loader DEX mapping line was not found; refusing an uncertain patch.")
          if count != 1:
              raise SystemExit(f"Expected exactly one DEX mapping line, found {count}.")
          path.write_text(source.replace(wrong, right), encoding="utf-8")
          print("Corrected rewritten-JAR mapping to use the original JAR's DEX cache.")
          PY
          grep -n "File siblingDex = JamDexHost.dexFor(dexJar);" "$TARGET"

      - name: Fix rewritten JAR suffix matching order
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$SOURCE_ROOT/app/src/main/java/opendoja/android/EntryActivity.java"
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?P<indent>\s*)if \(jarName\.endsWith\("\.rewritten\.jar"\)\) \{\n'
              r'(?P=indent)    String baseName = jarName\.substring\(0, jarName\.length\(\) - "\.rewritten\.jar"\.length\(\)\);\n'
              r'(?P=indent)    dexJar = new File\(jamJar\.getParentFile\(\), baseName \+ "\.jar"\);\n'
              r'(?P=indent)\} else if \(jarName\.endsWith\("\.dex\.rewritten\.jar"\)\) \{\n'
              r'(?P=indent)    String baseName = jarName\.substring\(0, jarName\.length\(\) - "\.dex\.rewritten\.jar"\.length\(\)\);\n'
              r'(?P=indent)    dexJar = new File\(jamJar\.getParentFile\(\), baseName \+ "\.jar"\);\n'
              r'(?P=indent)\}'
          )
          match = pattern.search(source)
          if match:
              indent = match.group("indent")
              replacement = (
                  indent + 'if (jarName.endsWith(".dex.rewritten.jar")) {\n'
                  + indent + '    String baseName = jarName.substring(0, jarName.length() - ".dex.rewritten.jar".length());\n'
                  + indent + '    dexJar = new File(jamJar.getParentFile(), baseName + ".jar");\n'
                  + indent + '} else if (jarName.endsWith(".rewritten.jar")) {\n'
                  + indent + '    String baseName = jarName.substring(0, jarName.length() - ".rewritten.jar".length());\n'
                  + indent + '    dexJar = new File(jamJar.getParentFile(), baseName + ".jar");\n'
                  + indent + '}'
              )
              source = source[:match.start()] + replacement + source[match.end():]
          elif 'if (jarName.endsWith(".dex.rewritten.jar"))' in source and source.index('if (jarName.endsWith(".dex.rewritten.jar"))') < source.index('if (jarName.endsWith(".rewritten.jar"))'):
              print("Specific suffix check is already first.")
          else:
              raise SystemExit("Expected suffix block not found; refusing to patch.")
          path.write_text(source, encoding="utf-8")
          print("Verified .dex.rewritten.jar is checked before .rewritten.jar.")
          PY
          sed -n '1272,1284p' "$TARGET"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already include Android SDK.
      # Avoid setup-android@v3 here: the previous run failed while it
      # tried to resolve the obsolete SDK package named 'tools'.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK was not found on this runner."
            env | grep -E 'ANDROID_(HOME|SDK_ROOT)' || true
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK/cmdline-tools."
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept licenses and install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Download exact build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT/.build-deps"
          curl -fL --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.6/asm-9.6.jar \
            -o "$SOURCE_ROOT/.build-deps/asm-9.6.jar"
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/androidx/multidex/multidex/2.0.1/multidex-2.0.1.aar \
            -o "$SOURCE_ROOT/.build-deps/multidex-2.0.1.aar"
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/desugar_jdk_libs_nio/2.1.4/desugar_jdk_libs_nio-2.1.4.jar \
            -o "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_nio-2.1.4.jar"
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/desugar_jdk_libs_configuration_nio/2.1.4/desugar_jdk_libs_configuration_nio-2.1.4.jar \
            -o "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.jar"
          unzip -p "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.jar" \
            META-INF/desugar/d8/desugar.json \
            > "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json"
          test -s "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json"

      - name: "Adapt D8 input: package compiled classes as JAR"
        shell: bash
        run: |
          set -euo pipefail
          REAL_JAVA_HOME="$JAVA_HOME"
          WRAPPER_HOME="$RUNNER_TEMP/pocketdoja-java-wrapper"
          mkdir -p "$WRAPPER_HOME/bin"

          # Keep the real JDK tools available while intercepting java calls
          # that invoke D8, including calls made through $JAVA_HOME/bin/java.
          for tool in "$REAL_JAVA_HOME"/bin/*; do
            [ -e "$tool" ] || continue
            name="$(basename "$tool")"
            [ "$name" = "java" ] && continue
            ln -sfn "$tool" "$WRAPPER_HOME/bin/$name"
          done

          cat > "$WRAPPER_HOME/bin/java" <<'JAVA_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          REAL_JAVA="$POCKETDOJA_REAL_JAVA_HOME/bin/java"
          args=("$@")
          is_d8=0
          is_l8=0
          has_desugared_lib=0
          for arg in "${args[@]}"; do
            case "$arg" in
              com.android.tools.r8.D8|com.android.tools.r8.D8*) is_d8=1 ;;
              com.android.tools.r8.L8|com.android.tools.r8.L8*) is_l8=1 ;;
              --desugared-lib) has_desugared_lib=1 ;;
            esac
          done

          if [[ "$is_l8" -eq 1 ]]; then
            config="$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json"
            nio_lib="$SOURCE_ROOT/.build-deps/desugar_jdk_libs_nio-2.1.4.jar"
            if [[ ! -s "$config" ]]; then
              echo "::error::L8 desugared library configuration is missing: $config"
              exit 1
            fi
            if [[ ! -s "$nio_lib" ]]; then
              echo "::error::L8 NIO implementation JAR is missing: $nio_lib"
              exit 1
            fi
            if [[ "$has_desugared_lib" -eq 0 ]]; then
              args+=(--desugared-lib "$config")
            fi
            # build-api19-manual.sh already extracts this JAR into
            # build-manual/desugar-classes and passes that directory to L8.
            # Adding the source JAR again duplicates every class in L8.
            echo "::notice::L8 uses extracted NIO classes; source JAR is not added twice."
            echo "::notice::L8 args: $(printf '%q ' "${args[@]}")"
          fi

          if [[ "$is_d8" -eq 1 ]]; then
            echo "::notice::D8 launch intercepted; checking program inputs"
            for i in "${!args[@]}"; do
              input="${args[$i]}"
              if [[ -d "$input" ]] && find "$input" -type f -name '*.class' -print -quit | grep -q .; then
                jar_path="$RUNNER_TEMP/pocketdoja-d8-input-$i.jar"
                rm -f "$jar_path"
                "$POCKETDOJA_REAL_JAVA_HOME/bin/jar" cf "$jar_path" -C "$input" .
                test -s "$jar_path"
                args[$i]="$jar_path"
                echo "::notice::D8 directory input converted to JAR: $input -> $jar_path"
              fi
            done
          fi
          exec "$REAL_JAVA" "${args[@]}"
          JAVA_WRAPPER
          chmod +x "$WRAPPER_HOME/bin/java"

          echo "POCKETDOJA_REAL_JAVA_HOME=$REAL_JAVA_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$WRAPPER_HOME" >> "$GITHUB_ENV"
          echo "$WRAPPER_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Java wrapper is active
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          echo "java path=$(command -v java)"
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/java" -version >/dev/null 2>&1

      - name: Harden runtime crash diagnostics and include session logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ROOT" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])

          def replace_once(path, old, new, label):
              data = path.read_text(encoding="utf-8")
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              path.write_text(data.replace(old, new, 1), encoding="utf-8")

          home = root / "app/src/main/java/opendoja/android/HomeActivity.java"
          entry = root / "app/src/main/java/opendoja/android/EntryActivity.java"

          # Include the always-on per-process session logs and crash reports in
          # the diagnostics text. These are distinct from OpenDoJaLog's optional
          # pocketdoja-log.txt and were being omitted by the old diagnostics path.
          replace_once(
              home,
              """                report = buildDiagnosticsReport();
                          out = writeDiagnostics(report);
                          logOut = copyRuntimeLog();""",
              """                logOut = copyRuntimeLog();
                          report = buildDiagnosticsReport();
                          out = writeDiagnostics(report);""",
              "diagnostics capture order"
          )

          session_section = '''        // Always-on session logs are written independently by the Home and :game
                  // processes. Include all recent files, not just OpenDoJaLog's optional log.
                  sb.append("\\nPocketDoJa session logs (latest first):\\n");
                  try {
                      java.util.ArrayList<java.io.File> sessionLogs = new java.util.ArrayList<>();
                      java.io.File downloadsPocketDoJa = new java.io.File(
                              android.os.Environment.getExternalStoragePublicDirectory(
                                      android.os.Environment.DIRECTORY_DOWNLOADS), "PocketDoJa");
                      java.io.File[] roots = {
                              downloadsPocketDoJa,
                              getExternalFilesDir("diagnostics"),
                              new java.io.File(getFilesDir(), "diagnostics")
                      };
                      for (java.io.File folder : roots) {
                          if (folder == null) continue;
                          java.io.File[] files = folder.listFiles();
                          if (files == null) continue;
                          for (java.io.File file : files) {
                              if (file.isFile() && file.getName().startsWith("pocketdoja_logcat_")
                                      && file.getName().endsWith(".txt")) {
                                  boolean duplicate = false;
                                  for (java.io.File seen : sessionLogs) {
                                      if (seen.getCanonicalPath().equals(file.getCanonicalPath())) {
                                          duplicate = true;
                                          break;
                                      }
                                  }
                                  if (!duplicate) sessionLogs.add(file);
                              }
                          }
                      }
                      java.util.Collections.sort(sessionLogs, (a, b) ->
                              Long.compare(b.lastModified(), a.lastModified()));
                      if (sessionLogs.isEmpty()) {
                          sb.append("  (no session log files found)\\n");
                      } else {
                          for (int i = 0; i < Math.min(8, sessionLogs.size()); i++) {
                              java.io.File file = sessionLogs.get(i);
                              sb.append("\\n--- ").append(file.getAbsolutePath()).append(" ---\\n");
                              sb.append(tail(file, 1200));
                          }
                      }
                  } catch (Throwable sessionLogFailure) {
                      sb.append("  could not enumerate session logs: ").append(sessionLogFailure).append('\\n');
                  }

                  sb.append("\\nPocketDoJa crash reports:\\n");
                  try {
                      java.io.File[] crashCandidates = {
                              new java.io.File(android.os.Environment.getExternalStoragePublicDirectory(
                                      android.os.Environment.DIRECTORY_DOWNLOADS), "pocketdoja-crash.txt"),
                              new java.io.File(getExternalFilesDir(null), "pocketdoja-crash.txt"),
                              new java.io.File(getFilesDir(), "pocketdoja-crash.txt")
                      };
                      boolean foundCrash = false;
                      for (java.io.File crash : crashCandidates) {
                          if (crash != null && crash.isFile()) {
                              sb.append("--- ").append(crash.getAbsolutePath()).append(" ---\\n");
                              sb.append(tail(crash, 500));
                              foundCrash = true;
                              break;
                          }
                      }
                      if (!foundCrash) sb.append("  (no saved uncaught-crash report)\\n");
                  } catch (Throwable crashReadFailure) {
                      sb.append("  could not read crash report: ").append(crashReadFailure).append('\\n');
                  }

          '''
          replace_once(
              home,
              "        return sb.toString();",
              session_section + "        return sb.toString();",
              "session log report section"
          )

          # If the optional runtime log is absent, still surface the latest
          # always-on session log path in the diagnostics share sheet.
          replace_once(
              home,
              """        if (!source.exists()) {
                      return null;
                  }
                  java.io.File[] candidates = {""",
              """        if (!source.exists()) {
                      java.io.File folder = new java.io.File(
                              android.os.Environment.getExternalStoragePublicDirectory(
                                      android.os.Environment.DIRECTORY_DOWNLOADS), "PocketDoJa");
                      java.io.File[] logs = folder.listFiles((dir, name) ->
                              name.startsWith("pocketdoja_logcat_") && name.endsWith(".txt"));
                      if (logs != null && logs.length > 0) {
                          java.util.Arrays.sort(logs, (a, b) -> Long.compare(b.lastModified(), a.lastModified()));
                          return logs[0];
                      }
                      return null;
                  }
                  java.io.File[] candidates = {""",
              "session log fallback"
          )

          # Save uncaught game-process exceptions into the always-on session log
          # before delegating to Android's normal crash handler.
          replace_once(
              entry,
              """            if (previousCrashHandler != null) {
                          try {""",
              """            try {
                              HomeActivity.logSession(crashContext,
                                      "UNCAUGHT_CRASH thread=" + thread.getName(), throwable);
                          } catch (Throwable loggingFailure) {
                              android.util.Log.e("OpenDoJa", "Could not append uncaught crash to session log", loggingFailure);
                          }
                          if (previousCrashHandler != null) {
                          try {""",
              "uncaught crash session logging"
          )

          # Narrow the point of failure during EntryActivity startup.
          replace_once(
              entry,
              """        OpenDoJaLog.configure(OpenDoJaLog.Level.OFF);""",
              """        OpenDoJaLog.configure(OpenDoJaLog.Level.OFF);
                  HomeActivity.logSession(this, "GAME_ACTIVITY_INIT_LOGGING_READY", null);""",
              "EntryActivity logging checkpoint"
          )
          replace_once(
              entry,
              """        setContentView(root);""",
              """        setContentView(root);
                  HomeActivity.logSession(this, "GAME_ACTIVITY_UI_READY", null);""",
              "EntryActivity UI checkpoint"
          )
          replace_once(
              entry,
              """            launchThread.setDaemon(true);
                      launchThread.start();""",
              """            launchThread.setDaemon(true);
                      HomeActivity.logSession(this, "GAME_THREAD_START name=" + launchThread.getName(), null);
                      launchThread.start();""",
              "game thread checkpoint"
          )

          print("Diagnostics now include per-process session logs, crash reports, and game-start checkpoints.")
          PY

      - name: Build Android 4.4 API 19 debug APK
        shell: bash
        run: |
          set -euo pipefail
          # Temporary runtime diagnostics for the Monster Hunter JAM crash.
          python3 - "$SOURCE_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def replace_once(relative, old, new):
              path = root / relative
              data = path.read_text(encoding="utf-8")
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence in {relative}, found {count}: {old!r}")
              path.write_text(data.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/src/main/java/opendoja/android/HomeActivity.java",
              'private static final String DIAG_BUILD = "2026-11-11 15:55 led-blink";',
              'private static final String DIAG_BUILD = "2026-11-22 api19 jam-crash-diagnostics";'
          )
          replace_once(
              "app/src/main/java/opendoja/android/HomeActivity.java",
              "private static final boolean SAVE_DIAGNOSTICS_ENABLED = false;",
              "private static final boolean SAVE_DIAGNOSTICS_ENABLED = true;"
          )
          replace_once(
              "app/src/main/java/opendoja/android/DisplayActivity.java",
              "static final int DEFAULTS_VERSION = 1;",
              "static final int DEFAULTS_VERSION = 2;"
          )
          replace_once(
              "app/src/main/java/opendoja/android/DisplayActivity.java",
              '.putString(KEY_DEBUG, "disable")',
              '.putString(KEY_DEBUG, "enable")'
          )
          # Import runs in HomeActivity's process, not EntryActivity's game
          # process. Install a process-wide handler here as well, so a crash
          # during folder/JAM import is saved before Android terminates the app.
