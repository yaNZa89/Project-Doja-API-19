name: Build PocketDoJa API 19 from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-pocketdoja.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract PocketDoJa source ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ZIP in repository root; found ${#zips[@]}."
            ls -lah
            exit 1
          fi
          mkdir source
          unzip -q "${zips[0]}" -d source

          BUILD_SCRIPT="$(find source -type f -path '*/tools/build-api19-manual.sh' -print -quit)"
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "::error::tools/build-api19-manual.sh was not found in the ZIP."
            find source -maxdepth 4 -type f | head -200
            exit 1
          fi
          SOURCE_ROOT="${BUILD_SCRIPT%/tools/build-api19-manual.sh}"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          test -f "$SOURCE_ROOT/app/src/main/AndroidManifest.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already include Android SDK.
      # Avoid setup-android@v3 here: the previous run failed while it
      # tried to resolve the obsolete SDK package named 'tools'.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK was not found on this runner."
            env | grep -E 'ANDROID_(HOME|SDK_ROOT)' || true
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK/cmdline-tools."
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept licenses and install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Download exact build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT/.build-deps"
          curl -fL --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.6/asm-9.6.jar \
            -o "$SOURCE_ROOT/.build-deps/asm-9.6.jar"
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/androidx/multidex/multidex/2.0.1/multidex-2.0.1.aar \
            -o "$SOURCE_ROOT/.build-deps/multidex-2.0.1.aar"
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/desugar_jdk_libs_nio/2.1.4/desugar_jdk_libs_nio-2.1.4.jar \
            -o "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_nio-2.1.4.jar"
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/desugar_jdk_libs_configuration_nio/2.1.4/desugar_jdk_libs_configuration_nio-2.1.4.jar \
            -o "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.jar"
          unzip -p "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.jar" \
            META-INF/desugar/d8/desugar.json \
            > "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json"
          test -s "$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json"

      - name: "Adapt D8 input: package compiled classes as JAR"
        shell: bash
        run: |
          set -euo pipefail
          REAL_JAVA_HOME="$JAVA_HOME"
          WRAPPER_HOME="$RUNNER_TEMP/pocketdoja-java-wrapper"
          mkdir -p "$WRAPPER_HOME/bin"

          # Keep the real JDK tools available while intercepting java calls
          # that invoke D8, including calls made through $JAVA_HOME/bin/java.
          for tool in "$REAL_JAVA_HOME"/bin/*; do
            [ -e "$tool" ] || continue
            name="$(basename "$tool")"
            [ "$name" = "java" ] && continue
            ln -sfn "$tool" "$WRAPPER_HOME/bin/$name"
          done

          cat > "$WRAPPER_HOME/bin/java" <<'JAVA_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          REAL_JAVA="$POCKETDOJA_REAL_JAVA_HOME/bin/java"
          args=("$@")
          is_d8=0
          is_l8=0
          has_desugared_lib=0
          for arg in "${args[@]}"; do
            case "$arg" in
              com.android.tools.r8.D8|com.android.tools.r8.D8*) is_d8=1 ;;
              com.android.tools.r8.L8|com.android.tools.r8.L8*) is_l8=1 ;;
              --desugared-lib) has_desugared_lib=1 ;;
            esac
          done

          if [[ "$is_l8" -eq 1 && "$has_desugared_lib" -eq 0 ]]; then
            config="$SOURCE_ROOT/.build-deps/desugar_jdk_libs_configuration_nio-2.1.4.json"
            if [[ ! -s "$config" ]]; then
              echo "::error::L8 desugared library configuration is missing: $config"
              exit 1
            fi
            args+=(--desugared-lib "$config")
            echo "::notice::L8 desugared library configuration supplied: $config"
          fi

          if [[ "$is_d8" -eq 1 ]]; then
            echo "::notice::D8 launch intercepted; checking program inputs"
            for i in "${!args[@]}"; do
              input="${args[$i]}"
              if [[ -d "$input" ]] && find "$input" -type f -name '*.class' -print -quit | grep -q .; then
                jar_path="$RUNNER_TEMP/pocketdoja-d8-input-$i.jar"
                rm -f "$jar_path"
                "$POCKETDOJA_REAL_JAVA_HOME/bin/jar" cf "$jar_path" -C "$input" .
                test -s "$jar_path"
                args[$i]="$jar_path"
                echo "::notice::D8 directory input converted to JAR: $input -> $jar_path"
              fi
            done
          fi
          exec "$REAL_JAVA" "${args[@]}"
          JAVA_WRAPPER
          chmod +x "$WRAPPER_HOME/bin/java"

          echo "POCKETDOJA_REAL_JAVA_HOME=$REAL_JAVA_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$WRAPPER_HOME" >> "$GITHUB_ENV"
          echo "$WRAPPER_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Java wrapper is active
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          echo "java path=$(command -v java)"
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/java" -version >/dev/null 2>&1

      - name: Build Android 4.4 API 19 debug APK
        shell: bash
        run: |
          set -euo pipefail
          # Temporary runtime diagnostics for the Monster Hunter JAM crash.
          python3 - "$SOURCE_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def replace_once(relative, old, new):
              path = root / relative
              data = path.read_text(encoding="utf-8")
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence in {relative}, found {count}: {old!r}")
              path.write_text(data.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/src/main/java/opendoja/android/HomeActivity.java",
              'private static final String DIAG_BUILD = "2026-11-11 15:55 led-blink";',
              'private static final String DIAG_BUILD = "2026-11-22 api19 jam-crash-diagnostics";'
          )
          replace_once(
              "app/src/main/java/opendoja/android/HomeActivity.java",
              "private static final boolean SAVE_DIAGNOSTICS_ENABLED = false;",
              "private static final boolean SAVE_DIAGNOSTICS_ENABLED = true;"
          )
          replace_once(
              "app/src/main/java/opendoja/android/DisplayActivity.java",
              "static final int DEFAULTS_VERSION = 1;",
              "static final int DEFAULTS_VERSION = 2;"
          )
          replace_once(
              "app/src/main/java/opendoja/android/DisplayActivity.java",
              '.putString(KEY_DEBUG, "disable")',
              '.putString(KEY_DEBUG, "enable")'
          )
          replace_once(
              "app/src/main/java/opendoja/android/EntryActivity.java",
              """            if (previousCrashHandler != null) {
                          previousCrashHandler.uncaughtException(thread, throwable);
                      }""",
              """            try {
                          opendoja.host.OpenDoJaLog.error(EntryActivity.class,
                                  "uncaught exception on thread " + thread.getName(), throwable);
                          android.util.Log.e("OpenDoJa", "uncaught exception on thread " + thread.getName(), throwable);
                      } catch (Throwable ignored) {
                      }
                      if (previousCrashHandler != null) {
                          previousCrashHandler.uncaughtException(thread, throwable);
                      }"""
          )
          print("Applied temporary crash diagnostics and enabled in-app report export.")
          PY

          chmod +x "$SOURCE_ROOT/tools/build-api19-manual.sh"
          "$SOURCE_ROOT/tools/build-api19-manual.sh"
          APK="$SOURCE_ROOT/build-manual/PocketDoJa-legacy-v1.3.0a-api19-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Build script finished but expected APK is missing or empty: $APK"
            find "$SOURCE_ROOT/build-manual" -maxdepth 2 -type f -ls 2>/dev/null || true
            exit 1
          fi
          echo "APK produced: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketdoja-android44-legacy-manual-debug
          path: source/**/build-manual/PocketDoJa-legacy-v1.3.0a-api19-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketdoja-api19-build-diagnostics
          path: |
            source/**/build-manual/java-sources.txt
            source/**/build-manual/main-dex-rules.pro
            source/**/app/src/main/java/opendoja/android/JamAssets.java
            source/**/app/src/main/java/opendoja/android/EntryActivity.java
            source/**/app/src/main/java/opendoja/android/HomeActivity.java
            source/**/app/src/main/java/opendoja/android/JamDexHost.java
            source/**/app/src/main/java/opendoja/android/CustomFilePicker.java
            source/**/app/src/main/java/opendoja/android/DisplayActivity.java
            source/**/opendoja/src/main/java/opendoja/host/JamLauncher.java
            source/**/opendoja/src/main/java/opendoja/host/JamMetadataResolver.java
            source/**/opendoja/src/main/java/opendoja/host/JamGameJarLocator.java
            source/**/opendoja/src/main/java/opendoja/host/JamGameClassLoaderFactory.java
            source/**/opendoja/src/main/java/opendoja/host/DoJaRuntime.java
          if-no-files-found: warn
          retention-days: 14
          
